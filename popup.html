<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fast Gemini – Copilot Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="popup-container">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <img src="icons/icon32.png" alt="logo" class="header-logo" />
        <div>
          <div class="header-title">Fast Gemini</div>
          <div class="header-subtitle">GitHub Copilot Chat</div>
        </div>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="btnClear" title="Xóa hội thoại">🗑️</button>
        <button class="btn-icon" id="btnSettings" title="Cài đặt">⚙️</button>
      </div>
    </div>

    <!-- Status bar -->
    <div class="status-bar" id="statusBar">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Đang kiểm tra kết nối…</span>
    </div>

    <!-- Warning when no PAT is set -->
    <div class="warning-banner" id="noPATBanner" style="display:none">
      ⚠️ Chưa cấu hình GitHub Token.
      <a id="openSettingsLink">Mở Settings</a> để thiết lập.
    </div>

    <!-- Chat messages -->
    <div class="chat-area" id="chatArea">
      <div class="welcome" id="welcomeMsg">
        <div class="welcome-icon">🤖</div>
        <h2>Xin chào! Tôi là Copilot</h2>
        <p>Hỏi tôi bất cứ điều gì – viết code, giải thích, hay thảo luận ý tưởng.</p>
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <div class="input-row">
        <textarea
          class="input-textarea"
          id="inputMsg"
          placeholder="Nhập câu hỏi… (Enter gửi, Shift+Enter xuống dòng)"
          rows="1"
        ></textarea>
        <button class="btn-primary" id="btnSend" title="Gửi (Enter)">↑</button>
      </div>
      <div class="input-hint">Model: <span id="currentModel">gpt-4o</span></div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
