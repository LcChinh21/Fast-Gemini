<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fast Gemini</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">⚡ Fast Gemini</div>
      <button class="settings-btn" id="settingsBtn" title="Cài đặt">⚙️</button>
    </div>

    <!-- Chat Messages Area -->
    <div class="chat-container" id="chatContainer">
      <div class="welcome-message">
        <div class="welcome-icon">✨</div>
        <p>Xin chào! Tôi là Fast Gemini.</p>
        <p>Hãy đặt câu hỏi hoặc chụp ảnh để phân tích!</p>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-row">
        <textarea
          id="userInput"
          class="message-input"
          placeholder="Nhập tin nhắn..."
          rows="2"
        ></textarea>
      </div>
      <div class="button-row">
        <button class="capture-btn" id="captureBtn" title="Chụp ảnh khoanh vùng">
          📸 Chụp ảnh
        </button>
        <button class="send-btn" id="sendBtn">
          Gửi ➤
        </button>
      </div>
      <!-- Ảnh đã chụp preview -->
      <div class="image-preview" id="imagePreview" style="display:none;">
        <img id="previewImg" src="" alt="Ảnh đã chọn" />
        <button class="remove-image-btn" id="removeImageBtn" title="Xóa ảnh">✕</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2>⚙️ Cài đặt</h2>
        <button class="modal-close-btn" id="modalCloseBtn">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="apiKeyInput">🔑 Gemini API Key</label>
          <input
            type="password"
            id="apiKeyInput"
            class="form-input"
            placeholder="Nhập API Key của bạn..."
          />
          <small>
            Lấy API Key tại
            <a href="https://aistudio.google.com/app/apikeys" target="_blank">
              Google AI Studio
            </a>
          </small>
        </div>
        <div class="form-group">
          <label for="modelSelect">🤖 Model Gemini</label>
          <select id="modelSelect" class="form-input">
            <option value="gemini-2.0-flash">Gemini 2.0 Flash (Nhanh)</option>
            <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
            <option value="gemini-1.5-pro">Gemini 1.5 Pro (Mạnh)</option>
          </select>
        </div>
        <button class="save-btn" id="saveSettingsBtn">💾 Lưu cài đặt</button>
        <div class="save-status" id="saveStatus"></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
